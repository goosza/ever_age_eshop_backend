server.port=8080
# Server URL for Swagger (will be overridden in prod)
server.url=${SERVER_URL:http://localhost:8080}

# Default profile (will be overridden by SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database Configuration (will be overwritten by profiles)
# Use environment variables with fallback to local values
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/everage}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.csrf.enabled=false

# Payment Gateway - Stripe
stripe.api.key=${STRIPE_API_KEY:sk_test_your_test_key_here}

# Shipping Provider - Zasilkovna
zasilkovna.api.key=${ZASILKOVNA_API_KEY:your_zasilkovna_api_key}
zasilkovna.api.url=https://api.zasilkovna.cz
zasilkovna.webhook.secret=${ZASILKOVNA_WEBHOOK_SECRET:your_webhook_secret}

# Cloudflare R2
r2.access-key=${R2_ACCESS_KEY:your_r2_access_key}
r2.secret-key=${R2_SECRET_KEY:your_r2_secret_key}
r2.endpoint=${R2_ENDPOINT:https://<account-id>.r2.cloudflarestorage.com}
r2.bucket=${R2_BUCKET:your-bucket-name}
r2.public-url=${R2_PUBLIC_URL:https://media.your-domain.com}

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Logging (base level, details in logback-spring.xml)
logging.level.root=INFO
logging.level.com.everage.eshop=DEBUG