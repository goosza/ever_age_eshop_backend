# ============================================
# Development Profile (Docker environment)
# ============================================

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Admin HMAC Secret - set via environment variable in production
admin.secret=${ADMIN_SECRET}
# Dev mode disabled in dev/prod environments
admin.dev-mode=false

# Database Configuration (Dev)
# In Docker container using name of the service "postgres"
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/everage_dev}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Connection Pool (Dev)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration (Dev)
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging (Dev)
logging.level.root=INFO
logging.level.com.everage.eshop=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration (Dev)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Actuator (Dev - all endpoints)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Swagger (Dev - disabled in production)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@everage.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
support.email=${SUPPORT_EMAIL:support@everage.com}

# Zasilkovna Shipping (Dev)
zasilkovna.api.url=${ZASILKOVNA_API_URL:https://api.zasilkovna.cz/v4}
zasilkovna.api.key=${ZASILKOVNA_API_KEY}
zasilkovna.api.password=${ZASILKOVNA_API_PASSWORD}
zasilkovna.sender.id=${ZASILKOVNA_SENDER_ID}
zasilkovna.sender.name=${ZASILKOVNA_SENDER_NAME:Everage Shop}
zasilkovna.sender.email=${ZASILKOVNA_SENDER_EMAIL:shop@everage.com}
zasilkovna.sender.phone=${ZASILKOVNA_SENDER_PHONE:+420123456789}
zasilkovna.sandbox.enabled=${ZASILKOVNA_SANDBOX_ENABLED:false}
zasilkovna.enabled=${ZASILKOVNA_ENABLED:false}
# Webhook secret token — add to Zásilkovna callback URL: ?token=YOUR_SECRET
zasilkovna.webhook.secret=${ZASILKOVNA_WEBHOOK_SECRET:}

# Shipping Pricing (CZK) - Zone-based pricing for Europe
# Optimized for light packages (0.5-2 kg)
# Based on Zásilkovna tariffs for packages up to 2 kg

# Default prices (fallback to Zone 1) in CZK
shipping.pricing.pickup=69.00
shipping.pricing.zbox=59.00
shipping.pricing.home=119.00
shipping.pricing.carrier-pickup=79.00

# Zone 1: Central Europe (CZ, SK, PL, HU, AT, RO)
shipping.pricing.zones.zone1.countries=CZ,SK,PL,HU,AT,RO
shipping.pricing.zones.zone1.pickup=69.00
shipping.pricing.zones.zone1.zbox=59.00
shipping.pricing.zones.zone1.home=119.00
shipping.pricing.zones.zone1.carrier-pickup=79.00

# Zone 2: Western Europe (DE, FR, BE, NL, LU, SI, HR)
shipping.pricing.zones.zone2.countries=DE,FR,BE,NL,LU,SI,HR
shipping.pricing.zones.zone2.pickup=139.00
shipping.pricing.zones.zone2.zbox=129.00
shipping.pricing.zones.zone2.home=229.00
shipping.pricing.zones.zone2.carrier-pickup=149.00

# Zone 3: Rest of Europe (IT, ES, PT, GR, BG, EE, LV, LT, DK, SE, FI, NO, IE, CY, MT)
shipping.pricing.zones.zone3.countries=IT,ES,PT,GR,BG,EE,LV,LT,DK,SE,FI,NO,IE,CY,MT
shipping.pricing.zones.zone3.pickup=159.00
shipping.pricing.zones.zone3.zbox=149.00
shipping.pricing.zones.zone3.home=269.00
shipping.pricing.zones.zone3.carrier-pickup=169.00

# Free Shipping Configuration
# Enable free shipping for orders above threshold
shipping.pricing.free-shipping.enabled=true
shipping.pricing.free-shipping.min-order-amount=1000.00

