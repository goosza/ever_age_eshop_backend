# ============================================
# Development Profile (Docker environment)
# ============================================

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Database Configuration (Dev)
# In Docker container using name of the service "postgres"
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/everage_dev}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Connection Pool (Dev)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration (Dev)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging (Dev)
logging.level.root=INFO
logging.level.com.everage.eshop=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration (Dev)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Actuator (Dev - all endpoints)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Swagger (Dev)
springdoc.swagger-ui.enabled=true

# Zasilkovna Shipping (Dev)
zasilkovna.api.url=${ZASILKOVNA_API_URL:https://api.zasilkovna.cz/v4}
zasilkovna.api.key=${ZASILKOVNA_API_KEY}
zasilkovna.api.password=${ZASILKOVNA_API_PASSWORD}
zasilkovna.sender.id=${ZASILKOVNA_SENDER_ID}
zasilkovna.sender.name=${ZASILKOVNA_SENDER_NAME:Everage Shop}
zasilkovna.sender.email=${ZASILKOVNA_SENDER_EMAIL:shop@everage.com}
zasilkovna.sender.phone=${ZASILKOVNA_SENDER_PHONE:+420123456789}
zasilkovna.sandbox.enabled=${ZASILKOVNA_SANDBOX_ENABLED:false}