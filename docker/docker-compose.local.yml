  #   restart: unless-stopped

networks:
  everage-local-network:
    driver: bridge

volumes:
  postgres-local-data:
  # Uncomment volumes below if you enable corresponding services:
  # loki-local-data:
  # grafana-local-data:
  # portainer-local-data:
  # redis-local-data:
