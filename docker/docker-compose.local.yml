  #     - portainer-local-data:/data
  #   networks:
  #     - everage-local-network
  #   restart: unless-stopped

  # ============================================
  # Adminer - Database Web UI (Optional for local)
  # Uncomment for easy database management via web interface
  # Access at: http://localhost:8081
