services:
  # ============================================
  # Spring Boot Application (Local Dev)
  # ============================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: everage-app-local
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DATABASE_URL=jdbc:postgresql://postgres:5432/everage
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - SERVER_URL=http://localhost:8080
      - SERVER_PORT=8080
      - JAVA_OPTS=-Xmx512m -Xms256m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - everage-local-network
    labels:
      logging: "promtail"
      application: "everage-local"
      environment: "local"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Mailpit - Local Email Testing
  # Catches all outgoing emails for inspection
  # SMTP: localhost:1025
  # Web UI: http://localhost:8025
  # ============================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-local
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - everage-local-network
    restart: unless-stopped

  # ============================================
  # PostgreSQL Database (Local)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-local
    environment:
      - POSTGRES_DB=everage
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - everage-local-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d everage"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Loki - Log Aggregation (Optional for local)
  # Uncomment to enable local log aggregation
  # ============================================
  # loki:
  #   image: grafana/loki:2.9.3
  #   container_name: loki-local
  #   ports:
  #     - "3100:3100"
  #   volumes:
  #     - ../config/loki-config.yml:/etc/loki/local-config.yaml:ro
  #     - loki-local-data:/loki
  #   command: -config.file=/etc/loki/local-config.yaml
  #   networks:
  #     - everage-local-network
  #   restart: unless-stopped

  # ============================================
  # Promtail - Log Collector (Optional for local)
  # Uncomment to enable log collection locally
  # Note: Requires loki-config.yml and promtail-config.yml files
  # ============================================
  # promtail:
  #   image: grafana/promtail:3.3.1
