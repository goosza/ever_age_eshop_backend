  #     # - ../config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
  #   networks:
  #     - everage-local-network
  #   depends_on:
  #     - loki
  #   restart: unless-stopped

  # ============================================
  # Portainer - Docker Management (Optional for local)
  # Uncomment to manage Docker containers via web UI
  # Access at: https://localhost:9443 or http://localhost:9000
  # ============================================
  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: portainer-local
  #   ports:
  #     - "9443:9443"
  #     - "9000:9000"
  #   volumes:
