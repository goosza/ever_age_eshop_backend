  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #     - ../config/promtail-config.yml:/etc/promtail/config.yml:ro
  #   command: -config.file=/etc/promtail/config.yml
  #   networks:
  #     - everage-local-network
  #   depends_on:
  #     - loki
  #   restart: unless-stopped

  # ============================================
  # Grafana - Monitoring & Visualization (Optional for local)
  # Uncomment to enable monitoring dashboard locally
  # Access at: http://localhost:3000 (admin/admin)
  # ============================================
  # grafana:
  #   image: grafana/grafana:10.2.3
  #   container_name: grafana-local
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=admin
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #     - GF_SERVER_ROOT_URL=http://localhost:3000
  #   volumes:
  #     - grafana-local-data:/var/lib/grafana
