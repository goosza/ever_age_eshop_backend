services:
  # ============================================
  # Caddy - Reverse Proxy (single ingress point)
  # ============================================
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: everage-caddy
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"   # Grafana — acces only through Tailscale, limited in firewall
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - everage-network
    depends_on:
      - frontend-service
      - admin-service
      - everage-service
      - grafana
    restart: unless-stopped

  # ============================================
  # Frontend - React Application
  # ============================================
  frontend-service:
    image: ${FRONTEND_DOCKER_REGISTRY}/${FRONTEND_IMAGE_NAME}:${FRONTEND_IMAGE_TAG}
    container_name: everage-frontend-dev
    expose:
      - "80"
    volumes:
      # Mount videos and static assets from host
      - frontend-static:/usr/share/nginx/html/videos
      - frontend-products:/usr/share/nginx/html/products
    networks:
      - everage-network
    labels:
      logging: "promtail"
      application: "everage-frontend-dev"
      environment: "development"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Admin Panel - React Application
  # ============================================
  # Routed through Caddy at admin.dev.averageaccessories.com — gated by
  # Cloudflare Access (Zero Trust) at the Cloudflare edge, so only
  # allow-listed emails ever reach this container. See docs/ARCHITECTURE.md.
  admin-service:
    image: ${ADMIN_DOCKER_REGISTRY}/${ADMIN_IMAGE_NAME}:${ADMIN_IMAGE_TAG}
    container_name: everage-admin-dev
    expose:
      - "80"
    networks:
      - everage-network
    labels:
      logging: "promtail"
      application: "everage-admin-dev"
      environment: "development"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Spring Boot Application
  # ============================================
  everage-service:
    image: ${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    container_name: everage-service-dev
    expose:
      - "8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=dev

      # Cloudflare R2
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}

      # Database
      - DATABASE_URL=jdbc:postgresql://postgres:5432/everage_dev
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}

      # Server
      - SERVER_URL=http://${SERVER_IP}:8080
      - SERVER_PORT=8080

      # Stripe
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}

      # Admin Auth
      - ADMIN_SECRET=${ADMIN_SECRET}
      - ADMIN_DEV_MODE=false

      # Mail
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}

      # Zásilkovna
      - ZASILKOVNA_API_KEY=${ZASILKOVNA_API_KEY}
      - ZASILKOVNA_API_PASSWORD=${ZASILKOVNA_API_PASSWORD}
      - ZASILKOVNA_SENDER_ID=${ZASILKOVNA_SENDER_ID}
      - ZASILKOVNA_WEBHOOK_SECRET=${ZASILKOVNA_WEBHOOK_SECRET}
      - ZASILKOVNA_ENABLED=${ZASILKOVNA_ENABLED:-false}

      # Frontend
      - FRONTEND_URL=${FRONTEND_URL}

      # Admin panel — needed for CORS allow-list (see SecurityConfig)
      - ADMIN_URL=${ADMIN_URL}

      # JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - everage-network
    labels:
      logging: "promtail"
      application: "everage-dev"
      environment: "development"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    environment:
      - POSTGRES_DB=everage_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    networks:
      - everage-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d everage_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================
  # Loki - Log Aggregation
  # ============================================
  loki:
    image: grafana/loki:2.9.3
    container_name: loki-dev
    expose:
      - "3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - everage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Promtail - Log Collector
  # ============================================
  promtail:
    image: grafana/promtail:latest
    container_name: promtail-dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - everage-network
    depends_on:
      - loki
    restart: unless-stopped

  # ============================================
  # Grafana - Monitoring Dashboard
  # ============================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana-dev
    expose:
      - "3000"
    environment:
      # Admin credentials
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}

      # Security
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false

      # Server
      - GF_SERVER_ROOT_URL=http://${SERVER_IP}:3000
      - GF_SERVER_DOMAIN=${SERVER_IP}

      # Anonymous access (optional - для демо)
      - GF_AUTH_ANONYMOUS_ENABLED=false

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - everage-network
    depends_on:
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Portainer - Docker Management UI
  # ============================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer-dev
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - everage-network
    environment:
      - PORTAINER_PASSWORD=${PORTAINER_PASSWORD}
    restart: unless-stopped

# ============================================
# Networks
# ============================================
networks:
  everage-network:
    driver: bridge
    name: everage-network

# ============================================
# Volumes
# ============================================
volumes:
  caddy-data:
    name: everage-caddy-data
  caddy-config:
    name: everage-caddy-config
  postgres-data:
    name: everage-postgres-data
  loki-data:
    name: everage-loki-data
  grafana-data:
    name: everage-grafana-data
  portainer-data:
    name: everage-portainer-data
  frontend-static:
    external: true
    name: everage-frontend-static
  frontend-products:
    external: true
    name: everage-frontend-products
