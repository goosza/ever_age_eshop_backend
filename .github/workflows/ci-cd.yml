name: CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: true
        type: choice
        options:
          - dev
          - prod
          - skip
        default: 'skip'
      branch:
        description: 'Branch/tag to deploy'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Job 1: Build and Test
  # ============================================
  build:
    name: Build and Run Tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      branch_tag: ${{ steps.extract_branch.outputs.BRANCH_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Build JAR
        run: ./gradlew bootJar --no-daemon

      - name: Get version
        id: get_version
        run: |
          VERSION=$(./gradlew properties --no-daemon --console=plain -q | grep "^version:" | awk '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Extract branch name
        id: extract_branch
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.branch }}" ]]; then
            # Manual deploy with specific branch
            BRANCH_TAG=$(echo "${{ github.event.inputs.branch }}" | sed 's/\//-/g')
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            BRANCH_TAG=${GITHUB_REF#refs/tags/}
          else
            BRANCH=${GITHUB_REF#refs/heads/}
            BRANCH_TAG=$(echo $BRANCH | sed 's/\//-/g')
          fi
          echo "BRANCH_TAG=$BRANCH_TAG" >> $GITHUB_OUTPUT
          echo "Branch/Tag: $BRANCH_TAG"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: everage-${{ steps.get_version.outputs.VERSION }}
          path: build/libs/*.jar
          retention-days: 7

  # ============================================
  # Job 2: Publish to GitHub Packages
  # ============================================
  publish-packages:
    name: 📦 Publish Maven to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Publish to GitHub Packages
        run: ./gradlew publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Published successfully
        run: |
          echo "✅ Published to GitHub Packages!"
          echo "📦 Package: https://github.com/${{ github.repository }}/packages"
          echo "📌 Version: ${{ needs.build.outputs.version }}"

  # ============================================
  # Job 3: Build and Push Docker Image
  # ============================================
  docker:
    name: 🐳 Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' || 
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/tags/v')
      )) ||
      (github.event_name == 'workflow_dispatch' && 
        github.event.inputs.environment != 'skip')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: everage-${{ needs.build.outputs.VERSION }}
          path: .

      - name: Prepare JAR for Docker
        run: |
          JAR_FILE=$(ls *.jar 2>/dev/null | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "JAR not found in artifacts, this shouldn't happen"
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"
          mv "$JAR_FILE" everage.jar
          ls -lh everage.jar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ needs.build.outputs.branch_tag }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Image Info
        run: |
          echo "✅ Docker image built and pushed!"
          echo "📦 Images:"
          echo "${{ steps.meta.outputs.tags }}"

  # ============================================
  # Job 4: Deploy to DEV (auto for main)
  # ============================================
  deploy-dev:
    name: 🚀 Deploy to DEV (Auto)
    needs: [build, docker]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main'
    environment:
      name: development

    steps:
      - name: Deploy to DEV Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEV_SSH_PASSPHRASE }}
          script: |
            set -e
            cd /opt/everage
            
            echo "📦 Starting deployment..."
            sed -i 's/IMAGE_TAG=.*/IMAGE_TAG=main/' .env
            
            echo "🔐 Logging in to registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "🐳 Pulling latest image..."
            docker compose pull app
            
            echo "🚀 Starting application..."
            docker compose up -d app
            
            echo "⏳ Waiting for app to start..."
            sleep 15
            
            if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
              echo "✅ Application is healthy!"
            else
              echo "⚠️ Health check failed, checking logs..."
              docker compose logs --tail=50 app
            fi
            
            echo "📊 Service status:"
            docker compose ps
            echo "✅ Deployment completed!"

      - name: Deployment Summary
        if: success()
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            🚀 **Deployed to Development**
            
            - Environment: `development`
            - Branch: `main`
            - Image: `ghcr.io/${{ github.repository }}:main`
            - Version: `${{ needs.build.outputs.version }}`
            - Commit: `${{ github.sha }}`
            
            ✅ Deployment successful!
            
            <details>
            <summary>📋 Build Details</summary>
            
            **Workflow Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            </details>

  # ============================================
  # Job 5: Manual Deploy to DEV
  # ============================================
  deploy-dev-manual:
    name: 🎯 Deploy to DEV (Manual)
    needs: [build, docker]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.environment == 'dev'
    environment:
      name: development

    steps:
      - name: Deploy to DEV Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEV_SSH_PASSPHRASE }}
          script: |
            set -e
            cd /opt/everage
            
            BRANCH_TAG="${{ needs.build.outputs.branch_tag }}"
            echo "📦 Manual deployment: $BRANCH_TAG"
            
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${BRANCH_TAG}/" .env
            
            echo "🔐 Logging in to registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "🐳 Pulling image: ${BRANCH_TAG}"
            docker compose pull app
            
            echo "🚀 Starting application..."
            docker compose up -d app
            
            echo "⏳ Waiting for app to start..."
            sleep 15
            
            if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
              echo "✅ Application is healthy!"
            else
              echo "⚠️ Health check failed"
              docker compose logs --tail=50 app
            fi
            
            docker compose ps
            echo "✅ Manual deployment completed!"

  # ============================================
  # Job 6: Deploy to PROD (auto for tags)
  # ============================================
  deploy-prod-auto:
    name: 🏭 Deploy to PROD (Auto)
    needs: [build, docker]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production

    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Check PROD server
        id: check_prod
        run: |
          if [ -z "${{ secrets.PROD_SERVER_HOST }}" ]; then
            echo "⚠️  PROD server not configured yet"
            echo "READY=false" >> $GITHUB_OUTPUT
          else
            echo "✅ PROD server configured"
            echo "READY=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to PROD Server
        if: steps.check_prod.outputs.READY == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/everage-prod
            
            echo "🏭 Deploying v${{ steps.get_version.outputs.VERSION }}..."
            
            echo "📦 Creating database backup..."
            docker exec postgres-prod pg_dump -U postgres everage_prod > \
              backup_$(date +%Y%m%d_%H%M%S).sql
            
            sed -i 's/IMAGE_TAG=.*/IMAGE_TAG=v${{ steps.get_version.outputs.VERSION }}/' .env
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull app
            docker compose up -d app
            
            echo "⏳ Waiting for app to start..."
            sleep 20
            
            if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
              echo "✅ Production deployment successful!"
            else
              echo "❌ Health check failed! Rolling back..."
              docker compose down app
              exit 1
            fi
            
            docker compose ps
            echo "✅ Production is live!"

      - name: PROD not ready notification
        if: steps.check_prod.outputs.READY == 'false'
        run: |
          echo "⚠️  Production deployment skipped"
          echo "PROD_SERVER_HOST secret not configured"
          echo ""
          echo "✅ Tag v${{ steps.get_version.outputs.VERSION }} created successfully"
          echo "📦 Docker image: ghcr.io/${{ github.repository }}:v${{ steps.get_version.outputs.VERSION }}"

      - name: Create GitHub Release
        if: steps.check_prod.outputs.READY == 'true' && success()
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            🎉 **Production Release v${{ steps.get_version.outputs.VERSION }}**
            
            ✅ Successfully deployed to production environment
            
            ### 📦 Artifacts
            
            **Docker Image:**
            ```
            docker pull ghcr.io/${{ github.repository }}:v${{ steps.get_version.outputs.VERSION }}
            ```
            
            **Maven Dependency:**
            ```xml
            <dependency>
            <groupId>com.everage.eshop</groupId>
            <artifactId>everage-service</artifactId>
            <version>${{ steps.get_version.outputs.VERSION }}</version>
            </dependency>
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Job 7: Manual Deploy to PROD
  # ============================================
  deploy-prod-manual:
    name: 🏭 Deploy to PROD (Manual)
    needs: [build, docker]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.environment == 'prod'
    environment:
      name: production

    steps:
      - name: Confirm Production Deployment
        run: |
          echo "⚠️  ⚠️  ⚠️  DEPLOYING TO PRODUCTION ⚠️  ⚠️  ⚠️"
          echo ""
          echo "Branch/Tag: ${{ needs.build.outputs.branch_tag }}"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo ""
          echo "This is a MANUAL production deployment."

      - name: Deploy to PROD Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/everage-prod
            
            BRANCH_TAG="${{ needs.build.outputs.branch_tag }}"
            echo "🏭 Manual deployment of $BRANCH_TAG to Production..."
            
            echo "📦 Creating database backup..."
            docker exec postgres-prod pg_dump -U postgres everage_prod > \
              backup_manual_$(date +%Y%m%d_%H%M%S).sql
            
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${BRANCH_TAG}/" .env
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull app
            docker compose up -d app
            
            sleep 20
            
            if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
              echo "✅ Manual production deployment successful!"
            else
              echo "❌ Deployment failed!"
              docker compose logs --tail=100 app
              exit 1
            fi
            
            docker compose ps
            echo "✅ Production deployment completed!"